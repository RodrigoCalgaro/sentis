## IDF Component Manager Manifest File — componente wifi
## Trae WiFi al ESP32-P4 (sin radio propia) via el co-procesador ESP32-C6
## a bordo, conectado por SDIO, usando esp_hosted como transporte
## transparente — el codigo de aplicacion sigue usando esp_wifi.h estandar
## sin API propia de esp_hosted (ver wifi.c).
##
## Version minima 2.12.12: fix real de un deadlock de lectura SDIO
## (commit 0985253, 2026-07-31, backporteado a 2.12.13 y 3.0.7) — sin este
## fix la ruta de recepcion SDIO puede quedar "muda" en silencio bajo carga.
dependencies:
  idf: ">=5.5"
  espressif/esp_hosted:
    version: ">=2.12.12"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target in [esp32p4]"
